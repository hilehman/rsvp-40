<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אישור הגעה – 40 שנות נישואין</title>
  <meta name="description" content="ערב שירים לכבוד 40 שנות הנישואין של יונתן ואילנה להמן · מוצאי שבת 12.12.26 · 19:30 · מועדון כפר אביב">
  <meta property="og:title" content="40 שנות נישואין – יונתן ואילנה להמן">
  <meta property="og:description" content="ערב של מוזיקה עברית · מוצאי שבת 12.12.26 · 19:30 · אישור הגעה">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://hilehman.github.io/rsvp-40/og.jpg">
  <meta name="theme-color" content="#fcf0e0">
  <link rel="preload" as="image" href="bg.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #fcf0e0;
      --ink: #3a3328;
      --muted: #7a6c58;
      --line: #e8dcc8;
      --field: rgba(255, 253, 249, .85);
      --accent: #5c6a3e;
      --accent-soft: rgba(92, 106, 62, .16);
      --sunset: #b8663f;
      --sunset-soft: rgba(184, 102, 63, .12);
      --notes: #a07a5c;
      --error: #a8322a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--sky);
      color: var(--ink);
      font-family: "Assistant", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      padding: 0 16px 40px;
    }

    /* Watercolor landscape, fixed behind the content (a fixed element, since iOS ignores background-attachment: fixed). */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("bg.webp") 22% 100% / cover no-repeat, var(--sky);
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      padding-top: 30vh;
    }
    .sheet {
      background: rgba(255, 251, 244, .55);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, .6);
      border-radius: 22px;
      box-shadow: 0 18px 50px -24px rgba(90, 60, 30, .45);
      padding: 30px 22px 26px;
    }

    header { text-align: center; }
    .notes { color: var(--notes); font-size: 20px; letter-spacing: 12px; margin-bottom: 6px; }
    h1 {
      font-family: "Frank Ruhl Libre", serif;
      font-weight: 900;
      font-size: clamp(36px, 10.5vw, 50px);
      line-height: 1.1;
      margin: 0 0 8px;
    }
    .names {
      font-family: "Frank Ruhl Libre", serif;
      font-size: 23px;
      font-weight: 700;
      margin: 0;
    }
    .tagline { color: var(--muted); margin: 2px 0 0; }
    .leaf { display: block; width: 64px; height: 2px; margin: 20px auto; background: var(--accent); border-radius: 2px; opacity: .35; }
    .details { margin: 0; }
    .details .place { color: var(--muted); }

    .surprise {
      margin: 18px auto 0;
      display: inline-block;
      padding: 5px 16px;
      border-radius: 999px;
      background: var(--sunset-soft);
      color: var(--sunset);
      font-weight: 600;
      font-size: 15px;
    }

    .card {
      margin-top: 26px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .row { display: flex; gap: 12px; }
    .row > .field { flex: 1; min-width: 0; }
    .field { margin-bottom: 20px; }
    label, .label { display: block; font-weight: 600; margin-bottom: 7px; }
    .optional { font-weight: 400; color: var(--muted); }
    input[type=text], textarea {
      width: 100%;
      font: inherit;
      font-size: 16px; /* 16px+ stops iOS from zooming into the field */
      line-height: 1.4;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea { min-height: 84px; resize: vertical; }

    .choices { display: flex; gap: 8px; }
    .choices input { position: absolute; opacity: 0; pointer-events: none; }
    .choices label {
      flex: 1;
      margin: 0;
      text-align: center;
      padding: 11px 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--field);
      cursor: pointer;
      font-weight: 600;
      transition: background .15s, color .15s, border-color .15s;
    }
    .choices input:focus-visible + label { box-shadow: 0 0 0 3px var(--accent-soft); }
    .choices input:checked + label { background: var(--accent); border-color: var(--accent); color: #fff; }

    .stepper { display: flex; align-items: center; gap: 12px; }
    .stepper button {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .stepper input {
      width: 64px;
      text-align: center;
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 7px 4px;
      background: var(--field);
    }
    .hidden { display: none !important; }
    .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); opacity: 0; }

    .error { color: var(--error); font-size: 15px; margin: -8px 0 14px; }
    .error:empty { display: none; }

    .submit {
      width: 100%;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .submit:disabled { opacity: .6; cursor: wait; }

    .thanks { text-align: center; padding: 4px 0; }
    .thanks .big { font-size: 40px; margin-bottom: 4px; }
    .thanks h2 {
      font-family: "Frank Ruhl Libre", serif;
      font-size: 26px;
      margin: 0 0 6px;
    }
    .thanks p { margin: 0 0 16px; }
    .linkbtn {
      background: none; border: none; padding: 0;
      font: inherit; color: var(--muted);
      text-decoration: underline; cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 22px;
      font-family: "Frank Ruhl Libre", serif;
      font-size: 22px;
      font-weight: 700;
    }

    /* Wide screens: keep the landscape whole and float the card over the open sky on the right. */
    @media (min-width: 900px) {
      body { padding: 0; }
      .bg { background-position: center bottom; }
      .wrap {
        margin: 0 6vw 0 auto;
        padding: 6vh 0 48px;
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
      .sheet { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
  <div class="sheet">
    <header>
      <div class="notes" aria-hidden="true">♪ ♫ ♪</div>
      <h1>40 שנות נישואין</h1>
      <p class="names">יונתן ואילנה להמן</p>
      <p class="tagline">ערב של מוזיקה עברית</p>
      <span class="leaf" aria-hidden="true"></span>
      <div class="details">
        <div><strong>מוצאי שבת, 12.12.26 · 19:30</strong></div>
        <div class="place">מועדון כפר אביב, יישובי גדרות</div>
      </div>
      <div class="surprise">🤫 זו הפתעה, נא לשמור בסוד</div>
    </header>

    <main class="card">
      <form id="rsvp" novalidate>
        <div class="row">
          <div class="field">
            <label for="firstName">שם פרטי</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="lastName">שם משפחה</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
          </div>
        </div>

        <div class="field">
          <span class="label" id="attLabel">הגעה לערב</span>
          <div class="choices" role="radiogroup" aria-labelledby="attLabel">
            <input type="radio" id="attYes" name="attending" value="כן">
            <label for="attYes">כן</label>
            <input type="radio" id="attMaybe" name="attending" value="אולי">
            <label for="attMaybe">אולי</label>
            <input type="radio" id="attNo" name="attending" value="לא">
            <label for="attNo">לא</label>
          </div>
        </div>

        <div class="field hidden" id="countField">
          <label for="guests" id="countLabel">כמה אנשים בסך הכול?</label>
          <div class="stepper">
            <button type="button" data-step="1" aria-label="הוספה">+</button>
            <input type="number" id="guests" name="guests" min="1" max="30" value="1" inputmode="numeric">
            <button type="button" data-step="-1" aria-label="הפחתה">−</button>
          </div>
        </div>

        <div class="field">
          <label for="notes">הערות <span class="optional">(לא חובה)</span></label>
          <textarea id="notes" name="notes"></textarea>
        </div>

        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <p class="error" id="error" role="alert"></p>
        <button type="submit" class="submit" id="submitBtn">שליחה</button>
      </form>

      <div class="thanks hidden" id="thanks" aria-live="polite">
        <div class="big" id="thanksIcon">🎶</div>
        <h2 id="thanksTitle">תודה!</h2>
        <p id="thanksText"></p>
        <button type="button" class="linkbtn" id="again">לעדכון התשובה</button>
      </div>
    </main>

    <footer>מחכים להתראות!</footer>
  </div>
  </div>

  <script>
    // Google Apps Script web app that writes responses to the Google Sheet.
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5gE3zxC0IhuT4sxHrxYXe1nsxiDnwZJkMkmHsPwS0_jtUGp_Whu6kYfJBILlh2MrW/exec';

    var form = document.getElementById('rsvp');
    var countField = document.getElementById('countField');
    var countLabel = document.getElementById('countLabel');
    var guests = document.getElementById('guests');
    var errorEl = document.getElementById('error');
    var submitBtn = document.getElementById('submitBtn');

    function attendingValue() {
      var checked = form.querySelector('input[name="attending"]:checked');
      return checked ? checked.value : '';
    }

    form.addEventListener('change', function (e) {
      if (e.target.name !== 'attending') return;
      var v = attendingValue();
      countField.classList.toggle('hidden', v === 'לא' || v === '');
      countLabel.textContent = v === 'אולי' ? 'כמה אנשים, אם יסתדר?' : 'כמה אנשים בסך הכול?';
      errorEl.textContent = '';
    });

    document.querySelectorAll('[data-step]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var n = (parseInt(guests.value, 10) || 0) + parseInt(btn.dataset.step, 10);
        guests.value = Math.min(30, Math.max(1, n));
      });
    });

    function send(data) {
      // Served by Apps Script: call the server function directly.
      if (window.google && google.script && google.script.run) {
        return new Promise(function (resolve, reject) {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitRsvp(data);
        });
      }
      // Hosted elsewhere: POST to the web app. text/plain avoids a CORS preflight.
      if (SCRIPT_URL) {
        return fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res.ok) throw new Error(res.error || 'error');
          return res;
        });
      }
      // Local preview with no backend: pretend it worked.
      console.warn('No backend configured – preview mode, nothing was saved.', data);
      return new Promise(function (resolve) { setTimeout(resolve, 500); });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.textContent = '';

      var data = {
        firstName: form.firstName.value.trim(),
        lastName: form.lastName.value.trim(),
        attending: attendingValue(),
        guests: '',
        notes: form.notes.value.trim(),
        website: form.website.value
      };

      if (!data.firstName || !data.lastName) { errorEl.textContent = 'נא למלא שם פרטי ושם משפחה'; return; }
      if (!data.attending) { errorEl.textContent = 'נא לבחור כן, אולי או לא'; return; }
      if (data.attending !== 'לא') {
        var n = parseInt(guests.value, 10);
        if (!n || n < 1) { errorEl.textContent = 'נא לציין כמה אנשים'; return; }
        data.guests = n;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'שולחים…';

      send(data).then(function () {
        showThanks(data);
      }).catch(function () {
        errorEl.textContent = 'משהו השתבש בשליחה. אפשר לנסות שוב בעוד רגע.';
      }).finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = 'שליחה';
      });
    });

    function showThanks(data) {
      var icon = '🎶', title = 'תודה ' + data.firstName + '!', text;
      if (data.attending === 'כן') {
        text = 'רשמנו ' + (data.guests === 1 ? 'אדם אחד' : data.guests + ' אנשים') + '. נתראה בערב!';
      } else if (data.attending === 'אולי') {
        icon = '🤞';
        text = 'נשמח מאוד אם יסתדר. אפשר לעדכן כאן בכל רגע.';
      } else {
        icon = '💛';
        text = 'תודה על העדכון. נתגעגע!';
      }
      document.getElementById('thanksIcon').textContent = icon;
      document.getElementById('thanksTitle').textContent = title;
      document.getElementById('thanksText').textContent = text;
      form.classList.add('hidden');
      document.getElementById('thanks').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('again').addEventListener('click', function () {
      document.getElementById('thanks').classList.add('hidden');
      form.classList.remove('hidden');
    });
  </script>
</body>
</html>
